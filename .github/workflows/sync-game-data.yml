name: Sync Wakfu game data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-game-data.mjs
      - run: node scripts/check-game-data.mjs
      - name: Commit synchronized data
        run: |
          git diff --quiet -- data sublimations-data.js && exit 0
          git config user.name "wakfu-builder-data-bot"
          git config user.email "wakfu-builder-data-bot@users.noreply.github.com"
          git add data sublimations-data.js
          git commit -m "chore(data): sync Wakfu game data"
          git push
